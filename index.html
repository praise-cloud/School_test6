<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id = "app1">
        <h1>This is a message from app1: {{ message }}</h1>
        <p>This is my ID: {{ ID }}</p>
        <input v-model="message"/>
    </div>

    <div id = "app2">
        <h1>This is a message from app2: {{ message }}</h1>
        <p>This is my ID: {{ ID }}</p>
    </div>

<script>
    const {createApp} = Vue;
    const myApp1 = Vue.createApp({
        data(){
            return{
                message: 'Hello Welcome to Vue3 !!!',
                ID: 123456
            }
        }
    })
    myApp1.mount('#app1');

    const myApp2 = Vue.createApp({
        data(){
            return{
                message: 'Hello App2 !!!',
                ID: 78910
            }
        }
    })
    myApp2.mount('#app2');
</script>

</body>
</html>
